<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>IndoV1ral</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --btn:#111827;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    -webkit-text-size-adjust:100%;
}

body{
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

.appbar{
    position:sticky;
    top:0;
    z-index:100;
    background:#fff;
    border-bottom:1px solid var(--line);
}

.bar-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    padding:12px 16px;
}

.brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
}

.logo{
    width:30px;
    height:30px;
    display:grid;
    place-items:center;
    background:#111827;
    color:#fff;
    border-radius:6px;
}

.spacer{
    flex:1;
}

.btn{
    border:0;
    padding:10px 16px;
    border-radius:12px;
    background:var(--btn);
    color:#fff;
    cursor:pointer;
    font-weight:600;
}

.wrap{
    max-width:1200px;
    margin:auto;
    padding:20px 16px;
}

.player-shell{
    display:grid;
    place-items:center;
}

.phone{
    width:clamp(240px,92vw,420px);
    aspect-ratio:9/16;
    background:#000;
    border-radius:22px;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.meta{
    margin-top:16px;
    color:var(--muted);
    font-size:13px;
    text-align:center;
}
</style>
</head>

<body>

<header class="appbar">
<div class="bar-inner">

<div class="brand">
<div class="logo">V</div>
<div>vldey<span style="color:#3b82f6">.co</span></div>
</div>

<div class="spacer"></div>

<button class="btn">Upload</button>

</div>
</header>

<main class="wrap">

<div class="player-shell">

<div class="phone">

<video
id="video"
controls
playsinline
preload="metadata">

<source
src="https://cdn2.videy.co/adKo4V3o1.mp4"
type="video/mp4">

Browser Anda tidak mendukung video HTML5.

</video>

</div>

<div class="meta">
Memuat video...
</div>

</div>

</main>

<noscript>
<p style="text-align:center;padding:20px">
Aktifkan JavaScript agar halaman berfungsi dengan baik.
</p>
</noscript>

<script>
const video = document.getElementById("video");
const meta = document.querySelector(".meta");

function formatTime(sec){
    if(!isFinite(sec)) return "0:00";
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,"0");
    return `${m}:${s}`;
}

video.addEventListener("loadedmetadata",()=>{
    meta.textContent = `0:00 / ${formatTime(video.duration)}`;
});

video.addEventListener("timeupdate",()=>{
    meta.textContent =
        `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
});

video.addEventListener("waiting",()=>{
    meta.textContent = "Memuat video...";
});

video.addEventListener("playing",()=>{
    meta.textContent =
        `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
});

video.addEventListener("ended",()=>{
    meta.textContent = "Video selesai diputar";
});

video.addEventListener("error",()=>{
    meta.textContent = "Gagal memuat video.";
});
</script>

</body>
  </html>
