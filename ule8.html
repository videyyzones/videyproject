<!doctype html>
<html lang="id">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Vudol</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#ffffff;
--text:#111827;
--muted:#6b7280;
--line:#e5e7eb;
--dark:#111827;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
background:#fff;
font-family:Inter,system-ui;
color:#111827;
}

.appbar{
position:sticky;
top:0;
z-index:50;
background:#fff;
border-bottom:1px solid var(--line);
}

.bar{
max-width:1200px;
margin:auto;
padding:12px 16px;
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:30px;
height:30px;
border-radius:8px;
background:#111827;
color:#fff;
display:grid;
place-items:center;
font-weight:700;
}

.spacer{
flex:1;
}

.upload-btn{
border:none;
background:#111827;
color:#fff;
padding:10px 14px;
border-radius:12px;
font-weight:600;
}

.wrap{
padding:18px;
text-align:center;
}

.phone{
width:clamp(240px,92vw,420px);
aspect-ratio:9/16;
margin:auto;
background:#000;
border-radius:24px;
overflow:hidden;
position:relative;
}

video{
width:100%;
height:100%;
display:block;
object-fit:cover;
background:#000;
}

.meta{
margin-top:14px;
font-size:13px;
color:#6b7280;
}

/* MODAL */

.age-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:9999;
backdrop-filter:blur(4px);
}

.age-box{
width:100%;
max-width:340px;
background:#fff;
border-radius:24px;
padding:26px;
text-align:center;
animation:popup .25s ease;
}

@keyframes popup{
from{
transform:scale(.9);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.age-title{
font-size:24px;
font-weight:700;
margin-bottom:10px;
color:#111827;
}

.age-text{
font-size:14px;
line-height:1.6;
color:#6b7280;
margin-bottom:22px;
}

.age-actions{
display:flex;
gap:10px;
}

.age-actions button{
flex:1;
border:none;
padding:13px;
border-radius:14px;
font-weight:600;
font-size:14px;
cursor:pointer;
}

.exit-btn{
background:#e5e7eb;
color:#111827;
}

.enter-btn{
background:#111827;
color:#fff;
}

</style>

</head>

<body>

<header class="appbar">
<div class="bar">

<div class="logo">
V
</div>

<strong>vldey.co</strong>

<div class="spacer"></div>

<button class="upload-btn">
Upload
</button>

</div>
</header>

<div class="wrap">

<div class="phone">

<video id="videoPlayer" controls playsinline preload="metadata">

<source src="https://cdn2.videy.co/A7xiEEOC1.mp4" type="video/mp4">

</video>

</div>

<div class="meta">
0:00 / 3:57 • Putar untuk memulai
</div>

</div>

<!-- MODAL KONFIRMASI -->

<div class="age-modal" id="ageModal">

<div class="age-box">

<div class="age-title">
Konfirmasi Usia
</div>

<div class="age-text">
Konten ini hanya dapat ditonton oleh pengguna berusia 18 tahun ke atas.
</div>

<div class="age-actions">

<button class="exit-btn"
onclick="window.location.href='https://google.com'">
Keluar
</button>

<button class="enter-btn" id="continueBtn">
Saya 18+
</button>

</div>

</div>

</div>

<!-- EVADAV POPUNDER -->

<script async src="https://pufted.com/p/waWQiOjEyMjgyNTAsInNpZCI6MTc4OTgzNywid2lkIjo3NDIwMzcsInNyYyI6Mn0=eyJ.js"></script>

<script>

const video = document.getElementById("videoPlayer");
const modal = document.getElementById("ageModal");
const continueBtn = document.getElementById("continueBtn");

let ageShown = false;

video.addEventListener("timeupdate", () => {

if(video.currentTime >= 15 && !ageShown){

ageShown = true;

video.pause();

modal.style.display = "flex";

}

});

continueBtn.addEventListener("click", () => {

modal.style.display = "none";

video.play();

});

</script>

</body>
  </html>
