<!DOCTYPE html><html lang="id">

<meta charset="UTF-8">

<title>V Video Hub</title><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f0f0f;
font-family:Arial,sans-serif;
color:#fff;
}

.header{
position:sticky;
top:0;
z-index:100;
background:#111;
border-bottom:1px solid #222;
padding:15px;
text-align:center;
}

.logo{
font-size:34px;
font-weight:900;
letter-spacing:2px;
}

.sub{
font-size:12px;
color:#999;
margin-top:4px;
}

.grid{
padding:12px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
max-width:900px;
margin:auto;
}

.card{
background:#181818;
border-radius:14px;
overflow:hidden;
box-shadow:0 4px 12px rgba(0,0,0,.4);
transition:.2s;
text-decoration:none;
}

.card:hover{
transform:translateY(-3px);
}

.thumb{
position:relative;
aspect-ratio:9/16;
background:linear-gradient(135deg,#000,#222);
display:flex;
align-items:center;
justify-content:center;
}

.vlogo{
font-size:60px;
font-weight:900;
color:#fff;
opacity:.95;
}

.play{
position:absolute;
width:58px;
height:58px;
border-radius:50%;
background:rgba(255,255,255,.15);
backdrop-filter:blur(5px);
display:flex;
align-items:center;
justify-content:center;
}

.play:before{
content:"";
margin-left:4px;
border-top:12px solid transparent;
border-bottom:12px solid transparent;
border-left:18px solid white;
}

.info{
padding:10px;
}

.title{
font-size:13px;
font-weight:bold;
line-height:1.4;
margin-bottom:6px;
}

.meta{
font-size:11px;
color:#aaa;
}

.footer{
padding:20px;
text-align:center;
font-size:12px;
color:#666;
}

@media(min-width:768px){
.grid{
grid-template-columns:repeat(4,1fr);
}
}
</style></head>
