<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Hub</title><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#121212;
font-family:Arial,sans-serif;
color:#fff;
}

.header{
position:sticky;
top:0;
background:#1b1b1b;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #2a2a2a;
z-index:100;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:12px;
padding:12px;
}

.card{
background:#1f1f1f;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.4);
}

.card video{
width:100%;
display:block;
background:#000;
}

.info{
padding:10px;
}

.title{
font-size:14px;
font-weight:bold;
margin-bottom:6px;
}

.btn{
display:block;
text-align:center;
background:#f0ad4e;
color:#000;
text-decoration:none;
padding:10px;
border-radius:6px;
font-weight:bold;
margin-top:8px;
}

.btn:hover{
background:#ec971f;
}

@media(max-width:480px){
.grid{
grid-template-columns:repeat(2,1fr);
}
}
</style></head>
<body><div class="header">VIDEO HUB</div><div class="grid" id="videoGrid"></div><script>
const videos = [
"https://cdn.videy.co/m8uOvANC1.mp4",
"https://cdn.videy.co/6DUw3c751.mp4",
"https://cdn2.videy.co/wgcbibEN1.mp4",
"https://cdn.videy.co/AwB9LIc31.mp4",
"https://cdn.videy.co/TyfRr7yF1.mp4",
"https://cdn2.videy.co/W8RlSSpg1.mp4",
"https://cdn2.videy.co/Mz1Riufx1.mp4",
"https://cdn2.videy.co/ssd4keuh1.mp4",
"https://cdn.videy.co/YMAJEwJp1.mp4",
"https://cdn2.videy.co/sE0VwbcS1.mp4",
"https://cdn.videy.co/TWRLKbDF1.mp4",
"https://cdn2.videy.co/I7EQ9hYZ1.mp4",
"https://cdn2.videy.co/yDYlzheT1.mp4",
"https://cdn2.videy.co/dRJ1Cxop1.mp4",
"https://cdn2.videy.co/MMGu7GTQ1.mp4",
"https://cdn2.videy.co/pVV9cnwD1.mp4",
"https://cdn2.videy.co/CdJHmdYC1.mp4",
"https://cdn2.videy.co/zQUqynC31.mp4",
"https://cdn2.videy.co/EOqU681P1.mp4",
"https://cdn2.videy.co/5IWtY8SQ1.mp4"
];

const grid = document.getElementById("videoGrid");

videos.forEach((url,index)=>{
const card = document.createElement("div");

card.className = "card";

card.innerHTML = `
<video controls preload="metadata">
<source src="${url}" type="video/mp4">
</video>

<div class="info">
<div class="title">Video ${index+1}</div>
<a class="btn" href="${url}" target="_blank" rel="noopener noreferrer">
Buka Video
</a>
</div>
`;

grid.appendChild(card);
});
</script></body>
</html>
